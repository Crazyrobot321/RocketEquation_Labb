name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Bygg och testa
    runs-on: ubuntu-latest
    env:
      BUILD_CONFIGURATION: Release
      # Forces the .NET 10 SDK to run tests using Microsoft.Testing.Platform instead of legacy VSTest
      DOTNET_TEST_RUNNER: Microsoft.Testing.Platform
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration $BUILD_CONFIGURATION

      - name: Test
        run: dotnet test --no-build --configuration $BUILD_CONFIGURATION
        
      - name: Vem och vad startade detta?
        env:
          STARTAD_AV: ${{github.actor}}
          HANDELSE: ${{github.event_name}}
          GREN: ${{github.ref_name}}
        run: |
            echo "Startad av $STARTAD_AV" - händelse: $HANDELSE - gren: $GREN"
            echo "Startad av $STARTAD_AV" - händelse: $HANDELSE - gren: $GREN" >> $GITHUB_STEP_SUMMARY

  formatering:
    name: Kodformatering
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Install .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Kontrollera kodformatering
        run: dotnet format --verify-no-changes --verbosity diagnostic
